<style>
#mini-cpp-review {
  --mc-bg: light-dark(#f1f4f3, #171c1b); --mc-surface: light-dark(#fff, #202625);
  --mc-soft: light-dark(#f6f8f7, #262d2b); --mc-line: light-dark(#d9e2de, #3c4643);
  --mc-ink: light-dark(#1b2824, #ecf2ef); --mc-muted: light-dark(#576961, #a2b3ab);
  --mc-accent: light-dark(#16664f, #80d7b6); --mc-tint: light-dark(#e4f3ec, #253e34);
  --mc-danger: light-dark(#aa3d40, #ffacad); --mc-danger-tint: light-dark(#fff0f0, #432c30);
  --mc-amber: light-dark(#815611, #f5cc78); --mc-amber-tint: light-dark(#fff4d9, #403823);
  --mc-blue: light-dark(#205f90, #92c9f2); --mc-purple: light-dark(#744091, #dbb0ef);
  --mc-mono: Consolas, 'Cascadia Mono', 'SFMono-Regular', 'Microsoft YaHei UI', monospace;
  color-scheme: light dark; color: var(--mc-ink); font: 14px/1.45 'Segoe UI','Microsoft YaHei UI','PingFang SC',sans-serif;
  text-align: start; letter-spacing: 0; position: relative; min-width: 0; isolation: isolate;
}
#mini-cpp-review *, #mini-cpp-review *::before, #mini-cpp-review *::after { box-sizing: border-box; }
#mini-cpp-review [hidden] { display: none !important; }
#mini-cpp-review :is(h1,h2,h3,p,pre) { margin: 0; }
#mini-cpp-review button, #mini-cpp-review input, #mini-cpp-review select { font: inherit; color: inherit; }
#mini-cpp-review button { background: none; border: 0; margin: 0; padding: 0; cursor: pointer; letter-spacing: 0; }
#mini-cpp-review button:disabled { opacity: .49; cursor: default; }
#mini-cpp-review :is(button,select,input,textarea):focus-visible { outline: 2px solid var(--mc-blue); outline-offset: 2px; z-index: 2; }
#mini-cpp-review :is(svg.lucide,i[data-lucide]) { display: inline-block; width: 16px; height: 16px; flex: 0 0 auto; vertical-align: middle; }
#mini-cpp-review code, #mini-cpp-review kbd, #mini-cpp-review pre { font-family: var(--mc-mono); }
#mini-cpp-review code, #mini-cpp-review kbd { color: inherit; background: none; border: 0; padding: 0; font-size: 1em; }
#mini-cpp-review .mc-sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
#mini-cpp-review .mc-reviewbar { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 14px; }
#mini-cpp-review .mc-reviewtag, #mini-cpp-review .mc-reviewmeta { display: flex; align-items: center; gap: 8px; color: var(--mc-muted); font-size: 12px; }
#mini-cpp-review .mc-rid { border-left: 3px solid var(--mc-accent); padding-left: 8px; font: 600 12px/1.25 var(--mc-mono); color: var(--mc-accent); }
#mini-cpp-review .mc-scenes { display: flex; flex-wrap: wrap; align-items: center; padding: 3px; gap: 1px; border: 1px solid var(--mc-line); background: var(--mc-soft); border-radius: 7px; }
#mini-cpp-review .mc-scenes button { font-size: 12px; min-height: 27px; padding: 3px 12px; border-radius: 4px; color: var(--mc-muted); }
#mini-cpp-review .mc-scenes button[aria-pressed=true] { color: var(--mc-ink); background: var(--mc-surface); box-shadow: 0 1px 3px #0d241a24; font-weight: 600; }
#mini-cpp-review .mc-reviewmeta { margin-left: auto; padding-right: 4px; }
#mini-cpp-review .mc-case { color: var(--mc-muted); background: var(--mc-surface); border: 1px solid var(--mc-line); padding: 4px; font-size: 12px; border-radius: 4px; }
#mini-cpp-review .mc-window, #mini-cpp-review .mc-identity { border: 1px solid var(--mc-line); border-radius: 8px; background: var(--mc-surface); box-shadow: 0 4px 16px #10261d0b; }
#mini-cpp-review .mc-titlebar, #mini-cpp-review .mc-id-head { display: flex; align-items: center; gap: 12px; position: relative; padding: 0 12px; min-height: 33px; background: var(--mc-bg); border-radius: 7px 7px 0 0; border-bottom: 1px solid var(--mc-line); }
#mini-cpp-review .mc-brand { display: inline-flex; align-items: center; gap: 9px; flex: 0 0 auto; }
#mini-cpp-review .mc-brand strong { font: 650 17px/1.2 'Segoe UI',sans-serif; }

<script>
(() => {
'use strict';
const classicGlyphs={"classic-compile":"<span class=\"mc-classic\" data-classic=\"compile\" aria-hidden=\"true\"><b></b><b></b><b></b><b></b><b></b><b></b><b></b><b></b></span>","classic-run":"<span class=\"mc-classic\" data-classic=\"run\" aria-hidden=\"true\"><b></b><b></b><b></b></span>","classic-buildRun":"<span class=\"mc-classic\" data-classic=\"buildRun\" aria-hidden=\"true\"><b></b><b></b><b></b><b></b><b></b><b></b></span>","classic-rebuild":"<span class=\"mc-classic\" data-classic=\"rebuild\" aria-hidden=\"true\"><b></b><b></b><b></b><b></b></span>"};
// Local review fixtures only. Nothing typed here is executed by a shell or sent to the host.
function makeRunConsole(host,{icon,onFinish,onDismiss}) {
  const q=s=>host.querySelector(s);
  let session=null,origin=null,timer=0;
  const dim=flag=>root.querySelectorAll('.mc-reviewbar,[data-window],[data-identity]').forEach(el=>{el.inert=flag;});
  function later(fn,ms){const active=session;clearTimeout(timer);timer=setTimeout(()=>{if(session===active&&!active.ended)fn();},ms);}
  function status(label,detail='',error=false){q('[data-term-state]').textContent=label;const h=q('[data-term-hint]');h.textContent=detail;h.classList.toggle('mc-term-error',error);}
  function entry(kind,text){
    const event={kind,text:String(text)};session.events.push(event);
    const line=document.createElement('div');line.dataset.termRow=kind;line.textContent=event.text;line.setAttribute('aria-label',`${kind==='in'?'输入':'输出'}：${event.text}`);
    const log=q('[data-term-log]');log.append(line);log.scrollTop=log.scrollHeight;
  }
  function end(aborted=false){
    if(!session||session.ended)return;
    clearTimeout(timer);session.ended=true;
    q('[data-term-form]').hidden=true;
    status(aborted?'已中止':'已退出',aborted?'':'退出码 0');
    if(!aborted)q('[data-term-close]').focus({preventScroll:true});
    onFinish({mode:session.mode,aborted,events:aborted?[]:session.events.slice()});
  }
  function drain(){q('[data-term-form]').hidden=true;status('正在结束');later(()=>end(),140);}
  function reset(){clearTimeout(timer);session=null;origin=null;host.hidden=true;host.replaceChildren();dim(false);}
  function dismiss(){
    if(!session)return;const focus=origin;if(!session.ended)end(true);reset();onDismiss();
    if(focus?.isConnected)focus.focus({preventScroll:true});
  }
  function hint(){const s=session;return s.n===null?'等待输入 n（0–64）':`等待第 ${s.seen+1} / ${s.n} 个整数`;}
  function submit(){
    const s=session;if(!s||s.ended||q('[data-term-form]').hidden)return;
    const input=q('[data-term-input]'),raw=input.value;if(!raw.trim())return;
    // Validate before echoing so a bad pasted line cannot partially advance the sample.
    let n=s.n,seen=s.seen,sum=s.sum;const pending=[];
    for(const line of raw.replace(/\r\n?/g,'\n').split('\n')){
      if(n!==null&&seen===n)break;
      pending.push(['in',line]);
      for(const token of line.trim().split(/\s+/).filter(Boolean)){
        if(n!==null&&seen===n)break;
        if(!/^[+-]?\d+$/.test(token)){status('等待输入','请输入十进制整数。',true);input.focus();return;}
        const val=Number(token);
        if(n===null){if(!Number.isInteger(val)||val<0||val>64){status('等待输入','样例的 n 范围是 0–64。',true);input.focus();return;}n=val;}
        else {if(!Number.isInteger(val)||val< -2147483648||val>2147483647||sum+val< -2147483648||sum+val>2147483647){status('等待输入','数值或累计和超出了 int 范围。',true);input.focus();return;}sum+=val;seen++;if(s.mode==='prefix')pending.push(['out',String(sum)]);}
      }
    }
    Object.assign(s,{n,seen,sum});input.value='';pending.forEach(([kind,text])=>entry(kind,text));
    if(n!==null&&seen===n){if(s.mode==='sum')entry('out',sum);drain();}else{status('运行中',hint());input.focus({preventScroll:true});}
  }
  function open({mode,file}){
    reset();origin=document.activeElement;session={mode,n:null,seen:0,sum:0,events:[],ended:false};
    host.innerHTML=`<section class="mc-term" role="dialog" aria-modal="true" aria-labelledby="mc-terminal-name">
      <header class="mc-term-head"><span class="mc-term-emblem">${icon('square-terminal')}</span><strong id="mc-terminal-name">命令行</strong><span class="mc-term-filename" data-term-name></span><button type="button" class="mc-gbtn" data-term-close aria-label="关闭命令行" data-tip="关闭命令行">${icon('x')}</button></header>
      <div class="mc-term-body"><div class="mc-term-log" role="log" aria-label="命令行输入输出" aria-live="polite" data-term-log></div>
      <form class="mc-term-form" data-term-form><span aria-hidden="true">›</span><textarea rows="1" maxlength="4096" spellcheck="false" autocomplete="off" autocapitalize="off" inputmode="text" aria-label="标准输入" aria-describedby="mc-term-hint" data-term-input></textarea><button class="mc-gbtn" type="submit" data-term-send aria-label="提交输入" data-tip="提交输入 · Enter">${icon('corner-down-left')}</button></form></div>
      <footer class="mc-term-foot"><span class="mc-term-state" data-term-state></span><span id="mc-term-hint" data-term-hint aria-live="polite"></span></footer></section>`;
    const interactive=mode==='sum'||mode==='prefix';q('[data-term-form]').hidden=!interactive;
    q('[data-term-name]').textContent=file.replace(/\.cpp$/i,'')+'.exe';
    host.hidden=false;dim(true);icons();
    status('运行中',interactive?hint():mode==='file'?'文件输入输出':mode==='long'?'标准输出':'');
    (interactive?q('[data-term-input]'):q('[data-term-close]')).focus({preventScroll:true});
    if(mode==='long'){let i=0;const tick=()=>{entry('out',++i);if(i===16)drain();else later(tick,95);};later(tick,180);}
    else if(!interactive)later(()=>end(),mode==='file'?600:180);
  }
  host.addEventListener('submit',e=>{e.preventDefault();submit();});
  host.addEventListener('click',e=>{if(e.target.closest('[data-term-close]'))dismiss();});
  host.addEventListener('keydown',e=>{
    if(!session)return;e.stopPropagation();
    if(e.isComposing||e.keyCode===229)return;
    if(e.key==='Escape'){e.preventDefault();dismiss();return;}
    if(e.key==='Enter'&&!e.shiftKey&&e.target.matches('[data-term-input]')){e.preventDefault();submit();return;}
    if(e.key==='Tab'){const items=Array.from(host.querySelectorAll('button,textarea')).filter(n=>!n.closest('[hidden]'));if(e.shiftKey&&document.activeElement===items[0]||!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();(e.shiftKey?items.at(-1):items[0]).focus();}}
  });
  return {open,reset,isOpen:()=>session!==null};
}

const source = [
  '#include <iostream>', 'using namespace std;', '', '// 读入 n 个整数，输出它们的和。',
  'int main() {', '    int n, x, sum = 0;', '    cin >> n;', '    for (int i = 0; i < n; ++i) {',
  '        cin >> x;', '        sum += x;', '    }', "    cout << sum << '\\n';", '    return 0;', '}'
];
const emptySource = ['#include <iostream>', '', 'int main() {', '    return 0;', '}'];
const runExamples={
  sum:source,
  prefix:[...source.slice(0,3),'// 每读入一个整数，就输出当前总和。',...source.slice(4,10),'        cout << sum << endl;',source[10],...source.slice(12)],
  long:['#include <iostream>','using namespace std;','','// 逐行输出 1 到 16。','int main() {','    for (int i = 1; i <= 16; ++i) {','        cout << i << endl;','    }','    return 0;','}'],
  file:['#include <fstream>','using namespace std;','','int main() {','    ifstream fin("sum.in");','    ofstream fout("sum.out");','    if (!fin || !fout) return 1;','    int n, x, sum = 0;','    fin >> n;','    for (int i = 0; i < n; ++i) {','        fin >> x;','        sum += x;','    }',"    fout << sum << '\\n';",'    return 0;','}']
};
const stops = [
  { line: 10, col: 9, i: 1, x: 8, sum: 3, changed: '', before: '' },
  { line: 8, col: 5, i: 1, x: 8, sum: 11, changed: 'sum', before: '3' },
  { line: 9, col: 9, i: 2, x: 8, sum: 11, changed: 'i', before: '1' },
  { line: 10, col: 9, i: 2, x: -2, sum: 11, changed: 'x', before: '8' },
  { line: 8, col: 5, i: 2, x: -2, sum: 9, changed: 'sum', before: '11' },
  { line: 12, col: 5, x: -2, sum: 9, changed: '', before: '' },
  { line: 13, col: 5, x: -2, sum: 9, changed: '', before: '' }
];
const ceSamples = {
  semicolon:{line:11,col:5,hintLine:10,hintCol:17,code:'        sum += x',msg:"error: expected ';' before '}' token",advice:'第 11 行的 <code>}</code> 前缺少分号。可能是上一行 <code>sum += x</code> 的末尾漏写了 <code>;</code>。'},
  name:{line:10,col:16,hintLine:10,hintCol:16,code:'        sum += xx;',msg:"error: 'xx' was not declared in this scope",advice:'第 10 行的 <code>xx</code> 未声明。上一行读入的是 <code>x</code>，请检查是否多写了一个 <code>x</code>。'}
};
function makeWorkbench(host) {
  const frame = () => stops[state.step];
  function lines() {
    const text = state.blank ? emptySource.slice() : state.scene==='edit'?runExamples[state.runCase].slice():source.slice();
    if (state.scene === 'error') text[9] = ceSamples[state.ce].code;
    return text;
  }
  function nameValue(name) { return name === 'n' ? 3 : frame()[name]; }
  function codeTokens(text, num) {
    if (text.startsWith('//')) return `<span class="wb-comment">${esc(text)}</span>`;
    if (text.startsWith('#')) return `<span class="wb-directive">#include</span> <span class="wb-string">${esc(text.slice(9))}</span>`;
    const vars = { n:1, x:1, sum:1, i:1 };
    return text.split(/('(?:\\.|[^'])*'|"(?:\\.|[^"])*"|\b(?:int|using|namespace|for|if|return|main|cin|cout|endl|ifstream|ofstream|std|n|x|sum|i)\b|\b\d+\b)/g).map(t => {
      if (vars[t] && state.scene==='debug' && nameValue(t)!==undefined) {
        return `<button type="button" class="wb-token" data-var="${t}" data-line-ref="${num}" aria-label="查看 ${t} 的值">${t}</button>`;
      }
      const cls = /^(?:int|using|namespace|for|if|return)$/.test(t) ? 'wb-key' : /^(?:main|cin|cout|endl|ifstream|ofstream|std)$/.test(t) ? 'wb-name' : /^['"]/.test(t) ? 'wb-string' : /^\d+$/.test(t) ? 'wb-number' : '';
      return cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    }).join('');
  }
  function drawLine(text, n) {
    const debug = state.scene==='debug', error = state.scene==='error';
    const current = debug && !state.running && n===frame().line;
    const bp = !state.blank && n===10 && state.breakpoint && debug;
    const picked = error && n===state.targetLine;
    const invalid = error && n===ceSamples[state.ce].line;
    const cls = `${current?' wb-at':''}${picked?' wb-picked':''}${invalid?' wb-invalid':''}`;
    const gutter = !state.blank && n===10 && debug ? `<button class="wb-bp-btn" type="button" data-act="breakpoint" aria-pressed="${bp}" aria-label="${bp?'移除':'添加'}第 10 行断点" data-tip="${bp?'移除':'添加'}断点"><span class="wb-break ${bp?'wb-solid':''}"></span></button>` : '';
    const marker = current ? '<span class="wb-arrow" aria-label="下一条将执行的语句">➜</span>' : invalid ? '<span class="wb-errmark" aria-label="编译器报错位置">!</span>' : '';
    const code=error && state.ce==='name' && n===10 ? codeTokens(text,n).replace('xx','<span class="wb-unknown">xx</span>') : codeTokens(text,n);
    return `<div class="wb-row${cls}" data-code-line="${n}"><span class="wb-gutter">${gutter}${marker}</span><span class="wb-lno" aria-hidden="true">${n}</span><code class="wb-line">${code}${error && state.ce==='semicolon' && n===10 && state.targetLine===10 ? '<span class="wb-insert" aria-label="建议补分号的位置"></span>':''}</code></div>`;
  }
  function inspector() {
    const f=frame(), running=state.running;
    const vars=['n','i','x','sum'].filter(v=>nameValue(v)!==undefined);

  if(['sourceInfo','about','shortcuts'].includes(a)){
    const tit={sourceInfo:'源文件属性',about:'关于 Mini C++',shortcuts:'快捷键'};
    const body=a==='sourceInfo'?`<p><code>${esc(fileName())}</code></p><p>C++${state.std} · UTF-8 · 单文件</p>`:a==='about'?'<p>Mini C++ · 设计审查 R03</p>':`<div class="mc-keylist">${[...changeSet,...menus.search,menus.edit[6]].map(c=>`<div><span>${c[2]}</span><kbd>${c[3]}</kbd></div>`).join('')}</div>`;
    sheet(a,tit[a],body);return;
  }
  if(['compile','run','buildRun','rebuild'].includes(a)) return build(a);
  if(['new','open','saveAs'].includes(a)) return fileSheet(a);
  if(editOps.includes(a)) return editingSheet(a);
  if(a==='save') {notice='已保存（样稿）';paint();say(notice);return;}
  if(a==='debug') {
    if(state.scene==='error'){state.panel='issues'; notice='编译失败，无法启动调试';paint();return;}
    if(state.blank||state.runCase!=='sum'){sheet('debugSample','调试样例','<p>断点预览：求总和 · main.cpp:10</p><div class="mc-dialog-actions"><button type="button" class="mc-sm-btn" data-dlg="sampleDebug">打开求和调试样例</button></div>','[data-dlg="sampleDebug"]');return;}
    return setScene('debug');
  }
  if(state.scene!=='debug') return;
  if(a==='breakpoint') state.breakpoint=!state.breakpoint;
  if(a==='step'&&!state.running){if(state.step<stops.length-1) state.step++; else finishDebug();}
  if(a==='continue'&&!state.running){state.running=true;runTimer=setTimeout(nextSample,720);}
  if(a==='pause'&&state.running){clearTimeout(runTimer);state.running=false;}
  if(a==='stop'){clearTimeout(runTimer);state.scene='edit';state.running=false;state.runPhase='aborted';state.record=null;state.panel='log';state.result='compiled';notice='已停止调试';}
  paint();say($('[data-status]').textContent);persist();
}
function fileSheet(id) {
  if(id==='open'){sheet(id,'打开源代码','<p>示例文件</p><button type="button" class="mc-sm-btn" data-dlg="openSample">'+icon('file-code-2')+' main.cpp</button>','[data-dlg="openSample"]');return;}
  const title=id==='new'?'新建源代码':'另存为';
  sheet(id,title,`<label>文件名<input type="text" data-filename autocomplete="off" maxlength="80" value="${id==='new'?'untitled.cpp':esc(fileName())}"></label><p>C++ 源文件（.cpp）</p><p data-file-warning role="alert" hidden></p><div class="mc-dialog-actions"><button class="mc-quiet" type="button" data-dlg="close">取消</button><button class="mc-tool mc-main" type="button" data-dlg="confirmFile">${id==='new'?'创建':'保存'}</button></div>`,'input');
  const inp=dlg.querySelector('input');inp.setSelectionRange(0,Math.max(0,inp.value.lastIndexOf('.')));
}
function confirmFile(){
  const inp=dlg.querySelector('[data-filename]'); if(!inp) return;
  let name=inp.value.trim(); if(name && !name.includes('.')) name+='.cpp';
  if(!/^[\p{L}\p{N}_-][\p{L}\p{N}_ .-]{0,70}\.cpp$/iu.test(name)||/^(con|prn|aux|nul|com[1-9]|lpt[1-9])\./i.test(name)) {
    const w=dlg.querySelector('[data-file-warning]');w.hidden=false;w.textContent='请输入有效的 .cpp 文件名，不含目录。';inp.focus();return;
  }
  const fresh=dialog==='new';closeDialog(false);clearTimeout(runTimer);
  if(fresh) Object.assign(state,{blank:true,scene:'edit',running:false,step:0,result:'idle',lastBuild:'idle',runPhase:'idle',record:null,panel:'console',file:name});
  else {state.file=name;state.running=false;}
  notice=fresh?'已新建源代码（样稿）':'已另存为（样稿）';paint();say(notice);persist();
}
const specimen=['if (x > 0) {','sum += x;','cout << sum;', '}'];
let draft=null;
const inv = {indent:'增加缩进',outdent:'减少缩进',format:'自动缩进选区',newline:'换行并继承缩进',selectAll:'全选',undo:'撤销',redo:'重做'};
function editingSheet(id){
  const search=id==='find'||id==='replace';
  if(search){draft={text:specimen.join('\n'),prev:null};
    sheet(id,id==='find'?'查找':'查找和替换',`<label>查找<input type="text" data-find value="sum" maxlength="80"></label>${id==='replace'?'<label>替换为<input type="text" data-replace value="total" maxlength="80"></label>':''}<p data-match></p><pre class="mc-example" data-code-preview></pre><div class="mc-dialog-actions">${id==='replace'?'<button type="button" class="mc-quiet" data-dlg="undoReplace" disabled>撤销</button><button type="button" class="mc-tool mc-main" data-dlg="replaceAll">全部替换</button>':''}<button type="button" class="mc-sm-btn" data-dlg="close">关闭</button></div>`,'[data-find]');findPreview();return;
  }
  const indented=['if (x > 0) {','    sum += x;', '    cout << sum;', '}'];
  const cases={
    indent:[specimen.slice(1,3).join('\n'),indented.slice(1,3).join('\n'),'Tab'],
    outdent:[indented.slice(1,3).join('\n'),specimen.slice(1,3).join('\n'),'Shift+Tab'],
    format:[specimen.join('\n'),indented.join('\n'),'Ctrl+Tab'],
    newline:['    if (x > 0) {▏','    if (x > 0) {\n        ▏','Enter'],
    selectAll:[specimen.join('\n'),specimen.join('\n'),'Ctrl+A'],
    undo:['    sum += value;', '    sum += x;', 'Ctrl+Z'],redo:['    sum += x;', '    sum += value;', 'Ctrl+Y']
  };
  const [before,after,key]=cases[id];draft={before,after,applied:false};
  sheet(id,inv[id],`<p>编辑片段 · <kbd>${key}</kbd></p><pre class="mc-example" data-mod></pre><div class="mc-dialog-actions"><button type="button" class="mc-sm-btn" data-dlg="demoReset">还原片段</button><button type="button" class="mc-tool mc-main" data-dlg="applyDemo">${inv[id]}</button></div>`,'[data-dlg="applyDemo"]');
  dlg.querySelector('[data-mod]').textContent=before;
}
function applyDemo(apply){
  draft.applied=apply;const el=dlg.querySelector('[data-mod]');el.textContent=apply?draft.after:draft.before;
  el.dataset.selected=String(dialog==='selectAll'&&apply||['indent','outdent','format'].includes(dialog));
  dlg.querySelector('[data-dlg="applyDemo"]').disabled=apply;
}
function findPreview(message=''){
  if(!dlg.querySelector('[data-find]'))return;
  const f=dlg.querySelector('[data-find]').value, pieces=f?draft.text.split(f):[draft.text];
  dlg.querySelector('[data-match]').textContent=message||`编辑片段 · ${pieces.length-1} 处匹配`;
  dlg.querySelector('[data-code-preview]').innerHTML=pieces.map(esc).join('<mark>'+esc(f)+'</mark>');
  const r=dlg.querySelector('[data-dlg="replaceAll"]');if(r)r.disabled=pieces.length<2;
  const u=dlg.querySelector('[data-dlg="undoReplace"]');if(u)u.disabled=draft.prev===null;
}
function dlgAct(a){
  if(a==='close')return closeDialog();
  if(a==='sampleDebug'||a==='openSample')return setScene(a==='sampleDebug'?'debug':'edit');
  if(a==='confirmFile')return confirmFile();
  if(a==='applyDemo'||a==='demoReset')return applyDemo(a==='applyDemo');
  if(a==='undoReplace'&&draft.prev!==null){draft.text=draft.prev;draft.prev=null;return findPreview();}
  if(a==='replaceAll'){const f=dlg.querySelector('[data-find]').value;if(!f)return;const bits=draft.text.split(f);draft.prev=draft.text;draft.text=bits.join(dlg.querySelector('[data-replace]').value);findPreview(`已替换 ${bits.length-1} 处`);}
}
root.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b){if(e.target===dlg)closeDialog();else if(!e.target.closest('[data-dropdown]'))closeMenu();return;}
  if(b.dataset.dlg)return dlgAct(b.dataset.dlg);
  if(b.dataset.scene)return setScene(b.dataset.scene);
  if(b.dataset.menu)return openMenu(b);
  if(b.dataset.act)return act(b.dataset.act);
  closeMenu();
  if(b.dataset.panel){state.panel=b.dataset.panel;notice='';paint();return;}
  if(b.dataset.jump){state.targetLine=Number(b.dataset.jump);paint();const row=$(`[data-code-line="${state.targetLine}"]`);row?.scrollIntoView({block:'nearest',behavior:'instant'});say($('[data-position]').textContent);}
});
root.addEventListener('input',e=>{if(e.target.matches('[data-find]'))findPreview();});
root.addEventListener('change',e=>{
  if(e.target.matches('[data-run-case]')&&Object.hasOwn(caseFiles,e.target.value)){applyRunCase(e.target.value);notice='';paint();persist();return;}
  if(e.target.matches('[data-case]')&&Object.hasOwn(ceSamples,e.target.value)){state.ce=e.target.value;state.targetLine=ceSamples[state.ce].line;state.panel='issues';notice='';paint();return;}
  if(e.target.matches('[data-std]')) state.std=e.target.value;
  else if(e.target.matches('[data-o2]')) state.o2=e.target.checked; else return;
  notice=`下次构建：C++${state.std} · ${state.o2?'-O2':'-O0'}`;status();icons();say(notice);persist();
});
root.addEventListener('keydown',e=>{
  if(e.key==='Escape'){clearTip();work.hoverClear();if(dialog)closeDialog();else if(menu){const old=menu;closeMenu();$(`[data-menu="${old}"]`).focus();}return;}
  if(dialog){
    if(e.key==='Enter'&&e.target.matches('[data-filename]')){e.preventDefault();confirmFile();return;}
    if(e.key==='Tab'){const cs=Array.from(dlg.querySelectorAll('button:not(:disabled),input'));if(e.shiftKey&&document.activeElement===cs[0]||!e.shiftKey&&document.activeElement===cs.at(-1)){e.preventDefault();(e.shiftKey?cs.at(-1):cs[0]).focus();}}
    if(inv[dialog] && (dialog==='format'&&e.ctrlKey&&e.key==='Tab'||dialog==='newline'&&e.key==='Enter'&&e.target.dataset.dlg==='applyDemo'||dialog==='selectAll'&&e.ctrlKey&&e.key.toLowerCase()==='a')) {e.preventDefault();applyDemo(true);}return;
  }
  if(state.scene==='icons')return;
  if(e.altKey&&!e.ctrlKey){const target=$$('[data-menu]').find(b=>b.getAttribute('aria-keyshortcuts').slice(-1)===e.key.toUpperCase());if(target){e.preventDefault();target.focus();openMenu(target);return;}}
  if(menu && ['ArrowDown','ArrowUp'].includes(e.key)){const items=Array.from(pop.querySelectorAll('button:not(:disabled)'));if(items.length){e.preventDefault();let n=items.indexOf(document.activeElement)+(e.key==='ArrowDown'?1:-1);items[(n+items.length)%items.length].focus();}return;}
  const byKey={F9:'compile',F10:'run',F11:'buildRun',F12:'rebuild'};
  const byCtrl={n:'new',o:'open',s:e.shiftKey?'saveAs':'save',f:'find',h:'replace',z:'undo',y:'redo',a:'selectAll',tab:'format'};
  const a=e.ctrlKey?byCtrl[e.key.toLowerCase()]:byKey[e.key];if(a){e.preventDefault();act(a);}
});
root.addEventListener('pointerover',e=>{const n=e.target.closest('[data-tip]');if(n&&!n.contains(e.relatedTarget))showTip(n);});
root.addEventListener('pointerout',e=>{const n=e.target.closest('[data-tip]');if(n&&!n.contains(e.relatedTarget))clearTip();});
root.addEventListener('focusin',e=>{const n=e.target.closest('[data-tip]');if(n&&e.target.matches(':focus-visible'))showTip(n);});
root.addEventListener('focusout',clearTip);
document.addEventListener('pointerdown',e=>{if(!root.contains(e.target)){closeMenu();work.hoverClear();clearTip();}});
drawTools();drawIdentity();paint();
if(window.openai?.widgetState)fromHost(window.openai.widgetState);
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)fromHost(e.detail.globals.widgetState);});
if(globalThis.Tweak){
  const opts={spacing:'标准'};
  const update=()=>{root.dataset.density=opts.spacing==='紧凑'?'compact':'normal';};
  const tweak=new Tweak({container:$('[data-window]'),onChange:update});
  tweak.addSelect(opts,'spacing',{label:'代码行距',options:['标准','紧凑']});
}

})();
</script>
</main></body></html>
