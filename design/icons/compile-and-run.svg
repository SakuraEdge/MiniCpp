<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">编译并运行</title>
  <style>svg{--edge:#494b4d;--paper:#fbfbfb;--tile:#c4c6c8;--key:#8295a4;--strip:#e1e1e1}@media(prefers-color-scheme:dark){svg{--edge:#d0d1d2;--paper:#292a2b;--tile:#787a7c;--key:#9cabb6;--strip:#515253}}</style>
  <rect x="1" y="1" width="16" height="16" fill="var(--edge)"/>
  <rect x="2" y="2" width="14" height="14" fill="var(--paper)"/>
  <rect x="2" y="2" width="14" height="2" fill="var(--strip)"/>
  <rect x="2" y="4" width="14" height="1" fill="var(--edge)"/>
  <rect x="4" y="7" width="4" height="3" fill="var(--key)"/>
  <rect x="10" y="7" width="4" height="3" fill="var(--tile)"/>
  <rect x="4" y="12" width="4" height="3" fill="var(--tile)"/>
  <rect x="10" y="12" width="4" height="3" fill="var(--tile)"/>
</svg>
