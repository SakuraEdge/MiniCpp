<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="18" height="18" role="img" aria-labelledby="title" shape-rendering="crispEdges">
  <title id="title">编译并运行</title>
  <style>svg{--edge:#424446;--orange:#dfa477;--mist:#bbcad3;--blue:#84adc5;--yellow:#e1ca7d;--bar:#d6b46e;--screen:#efefef}@media(prefers-color-scheme:dark){svg{--edge:#cecece;--orange:#e7b089;--mist:#c7d1da;--blue:#a1c1d4;--yellow:#e5d18e;--bar:#e4c481;--screen:#474747}}</style>
  <rect x="1" y="1" width="16" height="16" fill="var(--edge)"/>
  <rect x="2" y="2" width="14" height="3" fill="var(--bar)"/>
  <rect x="2" y="6" width="7" height="4" fill="var(--orange)"/>
  <rect x="10" y="6" width="6" height="4" fill="var(--mist)"/>
  <rect x="2" y="11" width="7" height="5" fill="var(--blue)"/>
  <rect x="10" y="11" width="6" height="5" fill="var(--yellow)"/>
</svg>
